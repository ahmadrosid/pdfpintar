name: Test & Deploy

on: push

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Forge deployment
        run: curl -fsS "https://forge.laravel.com/servers/858134/sites/2523245/deploy/http?token=${{ secrets.FORGE_TOKEN }}"
