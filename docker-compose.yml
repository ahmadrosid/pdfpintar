services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdfpintar
      POSTGRES_PASSWORD: pdfpintar
      POSTGRES_DB: pdfpintar
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pdfpintar -d pdfpintar']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/pdfpintar --ignore-existing &&
      exit 0
      "

  app:
    profiles: ['app']
    build:
      context: .
      target: dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://pdfpintar:pdfpintar@postgres:5432/pdfpintar
      BETTER_AUTH_URL: http://localhost:3000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: pdfpintar
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:9000
      AWS_USE_PATH_STYLE_ENDPOINT: 'true'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
  minio_data:
  app_node_modules:
